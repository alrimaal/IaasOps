apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-csi
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: hcloud-csi
      version: "2.*"
      sourceRef:
        kind: HelmRepository
        name: hcloud-csi-charts
        namespace: flux-system
  values:
    # Reuse the secret the Talos module already created in kube-system
    controller:
      hcloudToken:
        existingSecret:
          name: hcloud
          key: token
    # Keep openebs-hostpath as the cluster default; add hcloud-volumes alongside it.
    storageClasses:
      - name: hcloud-volumes
        defaultStorageClass: false
        reclaimPolicy: Retain
      - name: hcloud-volumes-encrypted
        defaultStorageClass: false
        reclaimPolicy: Retain
        extraParameters:
          csi.storage.k8s.io/node-publish-secret-name: csi-encryption-secret
          csi.storage.k8s.io/node-publish-secret-namespace: kube-system
