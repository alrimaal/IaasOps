apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: percona-xtradb
  namespace: mysql
spec:
  interval: 5m
  chart:
    spec:
      dependsOn:
        - name: percona-operator
      chart: percona/pxc-db
      version: "1.*" # or whatever version you want
      sourceRef:
        kind: HelmRepository
        name: percona-charts
        namespace: flux-system
  values:
    pxc:
      clusterSecretName: percona-xtradb-secrets
