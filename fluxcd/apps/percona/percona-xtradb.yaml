apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: percona-xtradb
  namespace: mysql
spec:
  interval: 5m
  dependsOn:
    - name: percona-operator
    - name: openebs
      namespace: storage
  chart:
    spec:
      chart: pxc-db
      version: "1.*" # or whatever version you want
      sourceRef:
        kind: HelmRepository
        name: percona-charts
        namespace: flux-system
  values:
    pxc:
      clusterSecretName: percona-xtradb-secrets
      persistence:
        enabled: true
        storageClass: "openebs-hostpath"
