apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: percona-xtradb
  namespace: mysql
spec:
  interval: 5m
  dependsOn:
    - name: percona-operator
    - name: openebs
      namespace: storage
  chart:
    spec:
      chart: pxc-db
      version: "1.*" # or whatever version you want
      sourceRef:
        kind: HelmRepository
        name: percona-charts
        namespace: flux-system
  values:
    tls:
      enabled: false # in favour of Cilium encryption
    pxc:
      clusterSecretName: percona-xtradb-secrets
      persistence:
        enabled: true
        storageClass: "openebs-hostpath"
    users:
      - name: grafanaUser
        dbs:
          - grafana
        grants:
          - SELECT
          - INSERT
          - UPDATE
          - DELETE
          - CREATE
        passwordSecretRef:
          name: grafana-mysql-secrets
