apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: percona-operator
  namespace: mysql
spec:
  interval: 5m
  dependsOn:
    - name: openebs
      namespace: storage
  chart:
    spec:
      chart: pxc-operator
      version: "1.*" # or whatever version you want
      sourceRef:
        kind: HelmRepository
        name: percona-charts
        namespace: flux-system

  values:
    cr:
      users:
        - name: grafanaUser
          dbs:
            - grafana
          grants:
            - SELECT
            - INSERT
            - UPDATE
            - DELETE
            - CREATE
          passwordSecretRef:
            name: grafana-mysql-secrets
