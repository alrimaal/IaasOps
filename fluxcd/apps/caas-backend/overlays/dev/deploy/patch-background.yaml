# app-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caas-background
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caas-background
  template:
    metadata:
      labels:
        app: caas-background
    spec:
      containers:
        - name: caas-background
          envFrom:
            - secretRef:
                name: caas-dev-secrets
            - configMapRef:
                name: caas-config
