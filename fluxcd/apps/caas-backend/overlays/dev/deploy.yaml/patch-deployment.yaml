# app-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caas-backend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caas-backend-dev
  template:
    metadata:
      labels:
        app: caas-backend-dev
    spec:
      containers:
        - name: caas-backend
          envFrom:
            - secretRef:
                name: caas-dev-secrets
