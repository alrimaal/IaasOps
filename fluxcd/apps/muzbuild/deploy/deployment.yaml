# app-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muzbuild-backend
  namespace: default
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: muzbuild-backend
  template:
    metadata:
      labels:
        app: muzbuild-backend
    spec:
      containers:
        - name: muzbuild-backend
          image: ghcr.io/alrimaal/muzbuild:0.2.1 # {"$imagepolicy": "default:muzbuild-backend"}
          imagePullPolicy: Always
          ports:
            - containerPort: 7000
          envFrom:
            - configMapRef:
                name: muzbuild-config
            - secretRef:
                name: muzbuild-secrets
      imagePullSecrets:
        - name: ghcr-secrets
