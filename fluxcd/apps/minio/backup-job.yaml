apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup-job
  namespace: minio
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mc
              image: alpine:3.20
              env:
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-backup-user-secrets
                      key: secretKey
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-secrets
                      key: accessKey
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-secrets
                      key: secretKey
                - name: DST_BUCKET_PREFIX
                  value: "alrimaal-minio-"
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  set -eu
                  apk add --no-cache ca-certificates curl
                  curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
                  chmod +x /usr/local/bin/mc
                  mc alias set local http://myminio-hl.minio-tenant.svc.cluster.local:9000 Sneeze3204 $MINIO_SECRET_KEY
                  mc alias set s3 https://s3.amazonaws.com $AWS_ACCESS_KEY_ID $AWS_SECRET_ACCESS_KEY
                  BUCKETS="$(mc ls local | awk '{print $5}' | sed 's:/$::' | tr '\n' ' ')"
                  echo "Found buckets: ${BUCKETS}"

                  for b in ${BUCKETS}; do
                    jobfile="/tmp/replicate-${b}.yaml"

                    # Create destination bucket (safe if already exists)
                    mc --debug mb -p "s3/${DST_BUCKET_PREFIX}${b}" 

                    # Build replicate job YAML per bucket using the structure from MinIO docs. :contentReference[oaicite:3]{index=3}
                    cat > "${jobfile}" <<-EOF
                  replicate:
                    apiVersion: v1
                    source:
                      type: minio
                      bucket: ${b}
                      # for 'local', omit endpoint & credentials per docs :contentReference[oaicite:4]{index=4}
                    target:
                      type: s3
                      bucket: ${DST_BUCKET_PREFIX}${b}
                      endpoint: "https://s3.amazonaws.com"
                      credentials:
                        accessKey: ${AWS_ACCESS_KEY_ID}
                        secretKey: ${AWS_SECRET_ACCESS_KEY}
                    flags:
                      allVersions: false
                      retry:
                        attempts: 5
                        delay: "2s"
                  EOF
                  echo "Starting batch replication job for bucket ${b} -> ${DST_BUCKET_PREFIX}${b}"
                  mc --debug batch start local "${jobfile}"
                  done

                  echo "All batch jobs started."
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
