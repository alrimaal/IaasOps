apiVersion: bfiola.dev/v1
kind: MinioBucket
metadata:
  name: pxc-backups
  namespace: minio
spec:
  deletionPolicy: IfEmpty
  lifecycle:
    Rules:
      - ID: expire-objects-after-30-days
        Status: Enabled
        Filter:
          Prefix: ""
        Expiration:
          Days: 7

  name: pxc-backups
  tenantRef:
    namespace: minio-tenant
    name: myminio
