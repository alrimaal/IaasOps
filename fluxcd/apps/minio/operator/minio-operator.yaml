apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio-operator
  namespace: minio
spec:
  interval: 5m
  chart:
    spec:
      chart: operator
      version: "7.1.1"
      sourceRef:
        kind: HelmRepository
        name: minio-charts
        namespace: flux-system
  values:
    operator:
      image:
        repository: ghcr.io/alrimaal/minio-operator
        tag: v7.1.1
        pullPolicy: IfNotPresent
      sidecarImage:
        repository: ghcr.io/alrimaal/minio-operator-sidecar
        tag: v7.0.1
        pullPolicy: IfNotPresent
