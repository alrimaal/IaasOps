apiVersion: bfiola.dev/v1
kind: MinioPolicy
metadata:
  name: qirtaas-dev
  namespace: minio
spec:
  name: qirtaas-dev
  statement:
    - effect: "Allow"
      action:
        - "s3:AbortMultipartUpload"
        - "s3:DeleteObject"
        - "s3:ListMultipartUploadParts"
        - "s3:PutObject"
        - "s3:GetObject"
      resource:
        - "arn:aws:s3:::qirtaas-dev/*"
    - effect: "Allow"
      action:
        - "s3:GetBucketLocation"
        - "s3:ListBucket"
        - "s3:ListBucketMultipartUploads"
      resource:
        - "arn:aws:s3:::qirtaas-dev"
  tenantRef:
    namespace: minio-tenant
    name: myminio
  version: "2012-10-17"
