apiVersion: bfiola.dev/v1
kind: MinioPolicy
metadata:
  name: muzbuild
  namespace: minio
spec:
  name: muzbuild
  statement:
    - effect: "Allow"
      action:
        - "s3:GetBucketLocation"
        - "s3:ListBucket"
      resource:
        - "arn:aws:s3:::muzbuild"
    - effect: "Allow"
      action:
        - "s3:DeleteObject"
        - "s3:GetObject"
        - "s3:PutObject"
      resource:
        - "arn:aws:s3:::muzbuild/*"
  tenantRef:
    namespace: minio-tenant
    name: myminio
  version: "2012-10-17"
