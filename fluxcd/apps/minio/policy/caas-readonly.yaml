apiVersion: bfiola.dev/v1
kind: MinioPolicy
metadata:
  name: caas-readonly
  namespace: minio
spec:
  name: caas-readonly
  statement:
    - effect: "Allow"
      action:
        - "s3:GetObject"
      resource:
        - "arn:aws:s3:::caas/*"
    - effect: "Allow"
      action:
        - "s3:ListBucket"
        - "s3:GetBucketLocation"
      resource:
        - "arn:aws:s3:::caas"
  tenantRef:
    namespace: minio-tenant
    name: myminio
  version: "2012-10-17"
