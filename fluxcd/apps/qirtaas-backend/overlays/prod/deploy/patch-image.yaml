# app-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qirtaas-backend
  namespace: default
spec:
  replicas: 4
  template:
    spec:
      containers:
        - name: qirtaas-backend
          image: ghcr.io/alrimaal/qirtaas-backend:0.2.6 # {"$imagepolicy": "default:qirtaas-backend"}
          resources:
            requests:
              memory: "5Gi"
          envFrom:
            - secretRef:
                name: qirtaas-secrets
            - configMapRef:
                name: qirtaas-config
