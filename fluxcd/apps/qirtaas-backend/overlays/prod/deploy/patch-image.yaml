# app-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qirtaas-backend
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: qirtaas-backend
          image: ghcr.io/alrimaal/qirtaas-backend:0.0.20 # {"$imagepolicy": "default:qirtaas-backend"}
          envFrom:
            - secretRef:
                name: qirtaas-secrets
            - configMapRef:
                name: qirtaas-config
