apiVersion: v1
kind: ConfigMap
metadata:
  name: qirtaas-config
  namespace: default
data:
  QURAN_API_BASE_URL: "https://apis.quran.foundation/content/api/v4"
  QURAN_OAUTH_TOKEN_URL: "https://oauth2.quran.foundation/oauth2/token"
  QURAN_OAUTH_REDIRECT_URI: "https://qirtaas.io/oauth/quran/callback"
  QURAN_POST_API_BASE_URL: "https://apis.quran.foundation/quran-reflect/v1"
  QURAN_CONCURRENT_REQUESTS: "1"
  QURAN_ELIGIBILITY_WINDOW_HOURS: "168" # 1 week
  QURAN_BATCH_SIZE: "2"
  MINIO_SECURE: "True"
  MINIO_ENDPOINT: "minio.alrimaal.com"
  MINIO_BUCKET_NAME: "qirtaas"
  BREVO_WELCOME_TEMPLATE_ID: "17"
  BREVO_MARKETING_TEMPLATE_ID: "18"
  MARKETING_EMAIL_DELAY_DAYS: "5"
  AUTOMATIC_EMAILS_ENABLED: "True"
  RENDER_FRONTEND_ORIGIN: "https://qirtaas.io"
  MINIO_EPHEMERAL_BUCKET_NAME: "qirtaas-ephemeral"
