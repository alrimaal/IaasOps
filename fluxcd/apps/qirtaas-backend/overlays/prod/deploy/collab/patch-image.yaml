# app-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qirtaas-collab
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: qirtaas-collab
          image: ghcr.io/alrimaal/qirtaas-collab:0.6.74 # {"$imagepolicy": "default:qirtaas-collab"}
          envFrom:
            - secretRef:
                name: qirtaas-collab-secrets-prod
