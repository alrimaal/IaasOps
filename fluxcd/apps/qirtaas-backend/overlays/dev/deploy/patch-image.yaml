# app-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qirtaas-backend
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: qirtaas-backend
          image: ghcr.io/alrimaal/qirtaas-backend:ephemeral
          envFrom:
            - secretRef:
                name: qirtaas-secrets
