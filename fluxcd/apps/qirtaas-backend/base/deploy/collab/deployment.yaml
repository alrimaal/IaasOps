# app-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qirtaas-collab
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qirtaas-collab
  template:
    metadata:
      labels:
        app: qirtaas-collab
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: qirtaas-collab
          imagePullPolicy: Always
          ports:
            - containerPort: 1234
          readinessProbe:
            tcpSocket:
              port: 1234
            periodSeconds: 5
      imagePullSecrets:
        - name: ghcr-secrets
