# app-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qirtaas-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qirtaas-frontend
  template:
    metadata:
      labels:
        app: qirtaas-frontend
    spec:
      containers:
        - name: qirtaas-frontend
          image: ghcr.io/alrimaal/qirtaas-frontend:ephemeral
