apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "77.*" # or whatever version you want
      sourceRef:
        kind: HelmRepository
        name: prometheus-stack-chart
        namespace: flux-system
  values:
    grafana:
      persistence:
        enabled: true
        type: pvc
        storageClassName: "local-path" # default for k3s
        accessModes:
          - ReadWriteOnce
        size: 20Gi
        finalizers:
          - kubernetes.io/pvc-protection
