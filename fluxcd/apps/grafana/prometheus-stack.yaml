apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "77.*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-stack-chart
        namespace: flux-system
  values:
    grafana:
      grafana.ini:
        database:
          type: mysql
          host: percona-xtradb-pxc-db-haproxy.mysql.svc.cluster.local
      envValueFrom:
        GF_DATABASE_USER:
          secretKeyRef:
            name: grafana-mysql-secrets
            key: database-user
        GF_DATABASE_PASSWORD:
          secretKeyRef:
            name: grafana-mysql-secrets
            key: database-password
