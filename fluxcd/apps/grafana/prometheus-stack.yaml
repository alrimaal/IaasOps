apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "77.*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-stack-chart
        namespace: flux-system
  values:
    prometheus:
      prometheusSpec:
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: "openebs-hostpath"
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
    grafana:
      grafana.ini:
        root_url: "https://grafana.intern.alrimaal.com"
        database:
          type: mysql
          host: percona-xtradb-pxc-db-haproxy.mysql.svc.cluster.local
          migration_locking: false
      envValueFrom:
        GF_DATABASE_USER:
          secretKeyRef:
            name: grafana-mysql-secrets
            key: database-user
        GF_DATABASE_PASSWORD:
          secretKeyRef:
            name: grafana-mysql-secrets
            key: database-password
