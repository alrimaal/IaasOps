# Called loki-app as vscode gives errors on name loki
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: loki
      version: "6.40.*"
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
  values:
    loki:
      ingester:
        max_chunk_age: 10m
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      pattern_ingester:
        enabled: true
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
      ruler:
        enable_api: true
      storage:
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
          admin: loki-admin
        s3:
          s3: "s3://myminio-hl.minio-tenant.svc.cluster.local:9000/"
          endpoint: "http://myminio-hl.minio-tenant.svc.cluster.local:9000"
          s3ForcePathStyle: true
          access_key_id: ${LOKI_MINIO_USERNAME}
          secret_access_key: ${LOKI_MINIO_PASSWORD}
          insecure: true
          region: null
          http_config:
            idle_conn_timeout: 90s
            response_header_timeout: 0s
            insecure_skip_verify: true
    memberlist:
      service:
        publishNotReadyAddresses: true

    deploymentMode: SingleBinary

    singleBinary:
      persistence:
        enabled: true
        storageClass: "openebs-hostpath"
        size: 1Gi
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: loki-secrets

    # Zero out replica counts of other deployment modes
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    resultsCache:
      allocatedMemory: 500
    chunksCache:
      allocatedMemory: 500
