apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-chart
  namespace: monitoring
spec:
  interval: 12h
  url: https://grafana.github.io/helm-charts
  values:
    grafana:
      persistence:
        enabled: true
        type: pvc
        storageClassName: "local-path" # default for k3s
        accessModes:
          - ReadWriteOnce
        size: 5Gi
