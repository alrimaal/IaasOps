apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: caas-backend-dev
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: caas-predeploy-dev
  path: "./fluxcd/apps/caas-backend/overlays/dev/deploy"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
