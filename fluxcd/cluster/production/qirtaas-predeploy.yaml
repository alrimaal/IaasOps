apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qirtaas-predeploy
  namespace: flux-system
spec:
  interval: 5m
  path: "./fluxcd/apps/qirtaas-backend/overlays/prod/predeploy"
  prune: true
  wait: true
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
