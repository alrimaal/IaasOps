apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qirtaas-backend
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: qirtaas-predeploy
  path: "./fluxcd/apps/qirtaas-backend/deploy"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
