apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-sops
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/cluster/production/secrets
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
