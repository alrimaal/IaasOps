apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: qirtaas-collab-route
  namespace: default
spec:
  parentRefs:
    - name: default-gateway
      namespace: cilium-gateway
      sectionName: https
  hostnames:
    - "collab.qirtaas.io"
  rules:
    - backendRefs:
        - name: qirtaas-collab
          namespace: default
          port: 80
