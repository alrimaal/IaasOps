apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: qirtaas-backend-route
  namespace: default
spec:
  parentRefs:
    - name: default-gateway
      namespace: cilium-gateway
      sectionName: https
  hostnames:
    - "qirtaas.alrimaal.com"
  rules:
    - backendRefs:
        - name: qirtaas-frontend
          namespace: default
          port: 80
