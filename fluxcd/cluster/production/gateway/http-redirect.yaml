apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: cilium-gateway
spec:
  parentRefs:
    - name: default-gateway
      namespace: cilium-gateway
      sectionName: http
  hostnames:
    - grafana.intern.alrimaal.com
  rules:
    # 1. ACME challenge path (exempt from redirect)
    - matches:
        - path:
            type: PathPrefix
            value: "/.well-known/acme-challenge/"
      forwardTo:
        - serviceName: cert-manager-http-solver
          port: 8089 # usually the solver service port

    # 2. All other HTTP traffic → redirect to HTTPS
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: "https"
            port: 443
            statusCode: 301
      forwardTo:
        - serviceName: grafana
          port: 3000
