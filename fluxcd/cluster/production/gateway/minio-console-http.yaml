apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: minio-route
  namespace: minio-tenant
spec:
  parentRefs:
    - name: default-gateway
      namespace: cilium-gateway
      sectionName: https
  hostnames:
    - "minio.intern.alrimaal.com"
  rules:
    - backendRefs:
        - name: minio-console
          namespace: minio-tenant
          port: 9090
