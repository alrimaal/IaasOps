apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: qirtaas-collab-dev-route
  namespace: dev
spec:
  parentRefs:
    - name: default-gateway
      namespace: cilium-gateway
      sectionName: https
  hostnames:
    - "qirtaascollab.alrimaal.com"
  rules:
    - backendRefs:
        - name: qirtaas-collab
          namespace: default
          port: 80
