apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: qirtaas-frontend-dev-route
  namespace: dev
spec:
  parentRefs:
    - name: default-gateway
      namespace: cilium-gateway
      sectionName: https
  hostnames:
    - "qirtaasdev.alrimaal.com"
  rules:
    - backendRefs:
        - name: qirtaas-frontend
          namespace: dev
          port: 80
