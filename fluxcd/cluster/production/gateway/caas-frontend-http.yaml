apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: caas-frontend-route
  namespace: default
spec:
  parentRefs:
    - name: default-gateway
      namespace: cilium-gateway
      sectionName: https
  hostnames:
    - "bunyaan.space"
  rules:
    - backendRefs:
        - name: caas-frontend
          namespace: default
          port: 80
