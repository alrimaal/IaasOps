apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-gateway
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: essam@alrimaal.com
    privateKeySecretRef:
      name: letsencrypt-gateway-account-key
    solvers:
      - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-token-secrets
            key: api-token
